<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Aniruddha Pest Control Services</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQl9mo7e7anBbx2kKfG4P9blcnzIIcCxmnXPg&s");
  background-size:cover;
  background-position:center;
}

/* ===== NAVBAR ===== */
.navbar{
  background:white;
  padding:12px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 15px rgba(0,0,0,.2);
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo img{
  width:55px;
  border-radius:6px;
}
.logo span{
  font-size:20px;
  font-weight:bold;
  color:#c60000;
}
.navbar a{
  text-decoration:none;
  font-weight:bold;
  margin-left:18px;
  color:#222;
  padding:8px 14px;
  border-radius:6px;
  transition:.3s;
}
.navbar a:hover{
  background:#c60000;
  color:white;
}

/* ===== LOGIN CARD ===== */
.auth-wrapper{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:calc(100vh - 80px);
}

.auth-container{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.95);
  padding:35px;
  border-radius:16px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  animation:slideUp .8s ease;
}

@keyframes slideUp{
  from{opacity:0;transform:translateY(50px)}
  to{opacity:1;transform:translateY(0)}
}

.auth-container h2{
  text-align:center;
  color:#c60000;
  margin-bottom:10px;
}
.auth-container p{
  text-align:center;
  font-size:14px;
  color:#555;
  margin-bottom:25px;
}

/* INPUT GROUP */
.input-group{
  position:relative;
  margin-bottom:18px;
}
.input-group input{
  width:100%;
  padding:14px 14px 14px 44px;
  border-radius:30px;
  border:1px solid #ccc;
  outline:none;
  font-size:15px;
  transition:.3s;
}
.input-group input:focus{
  border-color:#c60000;
  box-shadow:0 0 0 3px rgba(198,0,0,.15);
}
.input-group span{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
  color:#c60000;
}

/* LOGIN BUTTON */
button{
  width:100%;
  padding:14px;
  border-radius:30px;
  border:none;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(45deg,#c60000,#ff4d4d);
  color:white;
  transition:.3s;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(198,0,0,.4);
}

/* EXTRA */
.extra{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin:12px 0;
}
.extra a{
  text-decoration:none;
  color:#c60000;
  font-weight:bold;
}

/* SWITCH */
.switch{
  text-align:center;
  margin-top:20px;
  font-size:14px;
}
.switch a{
  color:#c60000;
  font-weight:bold;
  text-decoration:none;
}

/* TRUST BADGE */
.trust{
  margin-top:18px;
  text-align:center;
  font-size:13px;
  color:#555;
}
.trust span{
  color:#c60000;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">
    <img src="https://aniruddhapestcontrol.com/oglogo.jpg">
    <span>Aniruddha Pest Control</span>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="signup.html">Signup</a>
  </nav>
</header>

<!-- LOGIN -->
<div class="auth-wrapper">
  <div class="auth-container">

    <h2>Welcome Back 👋</h2>
    <p>Login to manage your pest control services</p>

    <form onsubmit="login(event)">

      <div class="input-group">
        <span>📧</span>
        <input type="email" placeholder="Email Address" required>
      </div>

      <div class="input-group">
        <span>🔒</span>
        <input type="password" placeholder="Password" required>
      </div>

      <div class="extra">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <button>Login Securely</button>
    </form>

    <div class="switch">
      New user? <a href="signup.html">Create Account</a>
    </div>

    <div class="trust">
      🔐 Secured by <span>Aniruddha Pest Control</span>
    </div>

  </div>
</div>

<script>
function login(e){
  e.preventDefault();
  alert("✅ Login Successful! (Backend can be connected later)");
}
</script>

</body>
</html>
